name: UMA SEO AI Agent
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      extra_site:
        description: "Extra site (optional)"
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: uma-agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agent
        run: python agent.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PSI_KEY: ${{ secrets.PSI_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
          EXTRA_SITE: ${{ github.event.inputs.extra_site }}
      - name: Save results
        run: |
          git config user.name "uma-seo-agent"
          git config user.email "uma-seo-agent@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "UMA agent: daily update"
            git pull --rebase origin main
            git push origin HEAD:main
           fi
